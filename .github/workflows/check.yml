name: Check addon

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Syntax check
        run: for f in AuctionHouseProfits/*.lua AuctionHouseProfits/Libs/SomethingNeedDoing/*.lua; do luajit -bl "$f" > /dev/null; done
      - name: Tests
        run: |
          luajit tests/model_test.lua
          luajit tests/runtime_test.lua
      - name: Package
        run: python3 tools/package.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: addon-zip
          path: dist/
          retention-days: 14
